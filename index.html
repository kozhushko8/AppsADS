<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent-blue: #2f81f7;
            --accent-green: #238636;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            max-width: 600px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border-color: #484f58;
        }

        .card-img-wrapper {
            width: 100%;
            height: 200px;
            background-color: #010409;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .platforms {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(110, 118, 129, 0.1);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
            min-width: 120px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-android {
            background-color: #238636;
            color: #ffffff;
        }

        .btn-apple {
            background-color: #2f81f7;
            color: #ffffff;
        }

        footer {
            margin-top: auto;
            padding-top: 60px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-sub);
            font-size: 1.2rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Applications</h1>
        <p>Explore our lineup of mobile and TV applications.</p>
    </header>

    <main class="container" id="apps-container">
        <div class="loading">Loading applications...</div>
    </main>

    <footer>
        &copy; <script>document.write(new Date().getFullYear())</script> All rights reserved.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Отримуємо мову браузера (наприклад "uk", "de", "en")
            const userLang = (navigator.language || navigator.userLanguage || "en").substring(0, 2).toLowerCase();
            
            fetch('./ads.json')
                .then(response => response.json())
                .then(apps => {
                    const container = document.getElementById('apps-container');
                    container.innerHTML = ''; // Очищаємо текст завантаження

                    apps.forEach(app => {
                        // Обираємо опис: мовою користувача -> або en -> або перший наявний
                        let desc = app.description[userLang] || app.description['en'] || Object.values(app.description)[0] || '';

                        // Створюємо картку
                        const card = document.createElement('div');
                        card.className = 'card';

                        // Формуємо бейджі платформ
                        const platformsHtml = (app.platforms || [])
                            .map(p => `<span class="badge">${p}</span>`)
                            .join('');

                        // Формуємо кнопки завантаження
                        let buttonsHtml = '';
                        if (app.android) {
                            buttonsHtml += `<a href="${app.android}" target="_blank" class="btn btn-android">Google Play</a>`;
                        }
                        if (app.apple) {
                            buttonsHtml += `<a href="${app.apple}" target="_blank" class="btn btn-apple">App Store</a>`;
                        }

                        // Слот картинки (беремо mobileImage, якщо немає — tvImage)
                        const imageUrl = app.mobileImage || app.tvImage || '';

                        card.innerHTML = `
                            <div class="card-img-wrapper">
                                <img src="${imageUrl}" alt="${app.title}" loading="lazy">
                            </div>
                            <div class="card-body">
                                <div class="card-title">${app.title}</div>
                                <div class="platforms">${platformsHtml}</div>
                                <div class="card-desc">${desc}</div>
                                <div class="buttons">${buttonsHtml}</div>
                            </div>
                        `;

                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error('Error loading ads.json:', err);
                    document.getElementById('apps-container').innerHTML = 
                        '<div class="loading">Failed to load applications list.</div>';
                });
        });
    </script>
</body>
</html>
