<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121614;
            --card-bg: #1a211e;
            --card-hover: #222b27;
            --border-color: #2b3631;
            --text-main: #f0f6fc;
            --text-sub: #9da8a3;
            --accent-green: #238636;
            --accent-blue: #2f81f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            font-weight: 300;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            max-width: 600px;
        }

        header h1 {
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 2.8rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1500px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: #3e4f47;
        }

        /* Зовнішня рамка */
        .device-frame {
            background-color: #0d1110;
            border-bottom: 1px solid var(--border-color);
            padding: 12px;
        }

        /* Екран без жорсткої висоти */
        .device-screen {
            position: relative;
            width: 100%;
            overflow: visible;
        }

        /* Головна картинка з aspect-ratio */
        .device-screen img.tv-img {
            width: 100%;
            aspect-ratio: 1 / 0.55;
            object-fit: cover;
            display: block;
            border-radius: 10px;
            border: 2px solid var(--border-color);
        }

        /* Фрейм телефону в лівому нижньому куті */
        .phone-overlay {
            position: absolute;
            left: 15px;
            bottom: 15px;
            width: 15%;
            z-index: 2;
        }

        .phone-overlay img {
            width: 100%;
            height: 100%;
            display: block;
            aspect-ratio: 9 / 18;
            border-radius: 10px;
            border: 2px solid #333;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .card-body {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .platforms {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.7rem;
            font-weight: 300;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Стиль для бейджів мов */
        .badge-lang {
            background: rgba(47, 129, 247, 0.1);
            border-color: rgba(47, 129, 247, 0.3);
            color: #58a6ff;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Exo 2', sans-serif;
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease;
            min-width: 110px;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-android {
            background-color: var(--accent-green);
            color: #ffffff;
        }

        .btn-apple {
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        footer {
            margin-top: 50px;
            color: var(--text-sub);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-sub);
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Our Applications</h1>
        <p>Discover cross-platform apps designed for your convenience.</p>
    </header>

    <main class="container" id="apps-container">
        <div class="loading">Loading applications...</div>
    </main>

    <footer>
        &copy; <script>document.write(new Date().getFullYear())</script> Apps Portfolio. All rights reserved.
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userLang = (navigator.language || navigator.userLanguage || "en").substring(0, 2).toLowerCase();
            
            fetch('./ads.json')
                .then(response => response.json())
                .then(apps => {
                    const container = document.getElementById('apps-container');
                    container.innerHTML = '';

                    apps.forEach(app => {
                        let desc = app.description[userLang] || app.description['en'] || Object.values(app.description)[0] || '';

                        const card = document.createElement('div');
                        card.className = 'card';

                        // Формуємо бейджі платформ та мов
                        const platformsHtml = (app.platforms || [])
                            .map(p => `<span class="badge">${p}</span>`)
                            .join('');

                        const languagesHtml = Object.keys(app.description || {})
                            .map(lang => `<span class="badge badge-lang">${lang.toUpperCase()}</span>`)
                            .join('');

                        const tagsHtml = platformsHtml + languagesHtml;

                        let buttonsHtml = '';
                        if (app.android) {
                            buttonsHtml += `<a href="${app.android}" target="_blank" class="btn btn-android">Google Play</a>`;
                        }
                        if (app.apple) {
                            buttonsHtml += `<a href="${app.apple}" target="_blank" class="btn btn-apple">App Store</a>`;
                        }

                        const tvImage = app.tvImage || '';
                        const mobileImage = app.mobileImage || '';

                        let phoneHtml = '';
                        if (mobileImage) {
                            phoneHtml = `
                                <div class="phone-overlay">
                                    <img src="${mobileImage}" alt="${app.title} mobile" loading="lazy">
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="device-frame">
                                <div class="device-screen">
                                    <img class="tv-img" src="${tvImage}" alt="${app.title}" loading="lazy">
                                    ${phoneHtml}
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="card-title">${app.title}</div>
                                <div class="platforms">${tagsHtml}</div>
                                <div class="card-desc">${desc}</div>
                                <div class="buttons">${buttonsHtml}</div>
                            </div>
                        `;

                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error('Error loading ads.json:', err);
                    document.getElementById('apps-container').innerHTML = 
                        '<div class="loading">Failed to load applications list.</div>';
                });
        });
    </script>
</body>
</html>
